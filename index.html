<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> 
  
  <title>CV – Michal Sobala</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="hero">
  <div class="hero-text">
    <h1 data-i18n="name"></h1>
    <h2 data-i18n="title"></h2>

  <div class="contact-row">
  <div class="contact-icons">
    <span><i class="fa-solid fa-phone"></i> <span data-i18n="phone"></span></span>
    <span><i class="fa-solid fa-envelope"></i> <span data-i18n="email"></span></span>
    <span><i class="fa-brands fa-linkedin"></i> <span data-i18n="linkedin"></span></span>
  </div>

  <div class="contact-icons">
    <span><i class="fa-solid fa-cake-candles"></i> <span data-i18n="dob"></span></span>
    <span><i class="fa-solid fa-id-card"></i> <span data-i18n="driving_license"></span></span>
    <span><i class="fa-solid fa-globe"></i> <span data-i18n="website"></span></span>
  </div>
</div>

    <div class="lang-switch">
      <button id="lang-pl">PL</button>
      <button id="lang-en">EN</button>
    </div>

    <div class="download-buttons">
      <a id="download-pl" href="#" target="_blank"></a>
      <a id="download-en" href="#" target="_blank"></a>
    </div>
  </div>

  <img src="img/photo.jpg" alt="Profile photo" class="profile-photo" />
</header>

<main>

  <!-- 2. Professional profile -->
  <section id="profile">
    <h3 data-i18n="section_profile"></h3>
    <p data-i18n="profile"></p>
  </section>

  <!-- 3. Professional experience -->
  <section id="experience">
    <h3 data-i18n="section_experience"></h3>
    <div id="experience-list"></div>
  </section>

  <!-- 4. Certificates -->
  <section id="certificates">
    <h3 data-i18n="section_certificates"></h3>
    <ul id="certificates-list"></ul>
  </section>

  <!-- 5. Key competences -->
  <section id="key_competencies">
    <h3 data-i18n="section_key_competencies"></h3>
    <ul id="competencies-list"></ul>
  </section>

  <section id="strengths">
  <h3 data-i18n="section_strengths"></h3>
  <ul id="strengths-list"></ul>
  </section>

  <section id="interests">
  <h3 data-i18n="section_interests"></h3>
  <ul id="interests-list"></ul>
  </section>  
  
  <!-- 6. Languages -->
  <section id="languages">
    <h3 data-i18n="section_languages"></h3>
    <ul id="languages-list"></ul>
  </section>

  <!-- 7. Clause -->
  <section id="clause">
    <h3 data-i18n="section_clause"></h3>
    <p data-i18n="clause"></p>
  </section>

</main>

<script src="script.js"></script>
</body>

</html>
